name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs replace each other rather than pile up.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Builds the browse-only copy: the UI plus the spec baked into a script,
      # since Pages has no backend to serve /api/spec.
      - name: Build the static site
        run: go run ./cmd/genstatic --out dist

      # Pages must be enabled once by hand:
      # Settings → Pages → Build and deployment → Source: GitHub Actions.
      # The workflow token is not allowed to turn it on by itself.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
